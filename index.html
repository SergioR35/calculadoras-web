<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <title>Calculadoras útiles</title>
</head>
<body>
  <div class="container">

    <h1>Calculadoras útiles para España</h1>

    <p>
      Herramientas sencillas para calcular sueldo neto, IVA,
      autónomos y finanzas personales.
    </p>

    <div class="card">
      <h2>Calculadora de IVA</h2>
      <p>Calcula el IVA fácilmente.</p>
    </div>

    <div class="card">
      <h2>Calculadora de sueldo neto</h2>
      <p>Convierte salario bruto a neto.</p>
    </div>

    <div class="card">
      <h2>Calculadora de autónomos</h2>
      <p>Estima cuotas e ingresos.</p>
    </div>

  </div>
</body>
</html>
